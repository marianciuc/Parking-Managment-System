spring:
  config:
    import: optional:configserver:${SPRING_CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: ${SPRING_APPLICATION_NAME:notification-service}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
        mail:
            smtp:
            auth: ${USE_AUTH:false}
            starttls:
                enable: false
            ssl:
                enable: ${ENABLE_SSL:false}
            connectiontimeout: 5000
            timeout: 3000
            writetimeout: 5000
server:
  port: ${SPRING_PORT:8022}
