<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to HandyParking</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #007BFF;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .greeting {
            font-size: 22px;
            color: #444;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .message {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        .cta {
            font-size: 18px;
            color: #ffffff;
            background: #007BFF;
            display: inline-block;
            padding: 15px 30px;
            border-radius: 8px;
            margin: 20px 0;
            text-decoration: none;
            font-weight: bold;
        }
        .warning {
            font-size: 14px;
            color: #d9534f;
            margin-top: 20px;
        }
        .footer {
            font-size: 12px;
            color: #777;
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">HandyParking</div>
    <p class="greeting">Welcome [[${name}}]] to HandyParking!</p>
    <p class="message">We're excited to have you on board. With HandyParking, you can easily find and book parking spots in just a few taps.</p>
    <p class="warning">If you did not sign up for HandyParking, please ignore this email.</p>
    <p class="footer">© 2025 HandyParking. All rights reserved.</p>
</div>
</body>
</html>
