spring:
  config:
    import: optional:configserver:${SPRING_CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: ${SPRING_APPLICATION_NAME:parking-service}
  datasource:
    url: jdbc:postgresql://${SPRING_DB_HOST:localhost}:${SPRING_DB_PORT:5432}/parking_db
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DB_USERNAME:root}
    password: ${SPRING_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
    user: ${SPRING_DB_USERNAME:root}
    password: ${SPRING_DB_PASSWORD:root}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_HOST:localhost}:${SPRING_KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: |
          changeParkingCurrencyMessage:pl.edu.zut.app.parking.parking.kafka.messages.ChangeParkingCurrencyMessage,
          createdParkingMessage:pl.edu.zut.app.parking.parking.kafka.messages.CreatedParkingMessage,
          sessionStartedMessage:pl.edu.zut.app.parking.parking.kafka.messages.SessionStartedMessage,
          sessionEndedMessage:pl.edu.zut.app.parking.parking.kafka.messages.SessionEndedMessage
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: parking-group
      properties:
        spring.json.type.mapping: |
          sessionStartedMessage:pl.edu.zut.app.parking.parking.kafka.messages.SessionStartedMessage,
          sessionEndedMessage:pl.edu.zut.app.parking.parking.kafka.messages.SessionEndedMessage,
          changeCurrencyMessage:pl.edu.zut.app.parking.parking.kafka.messages.ChangeCurrencyMessage,
          reviewUpdateMessage:pl.edu.zut.app.parking.parking.kafka.messages.ReviewUpdateMessage
server:
  port: ${SPRING_PORT:7022}