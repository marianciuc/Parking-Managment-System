spring:
  application:
    name: admin-service
  config:
    import: optional:configserver:http://localhost:0000
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: admin-service
      properties:
        spring.json.type.mapping: createdUserMessage:pl.edu.zut.app.parking.admin_ms.kafka.messages.CreatedUserMessage
  datasource:
    url: jdbc:postgresql://localhost:5432/administrators_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
    user: root
    password: root
server:
  port: 8022