<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parking Session Payment</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SF+Pro:wght@400;600&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles/index.css" />
  <link rel="icon" type="image/x-icon" href="/src/logo_black.svg" />
  <meta name="theme-color" content="#2C659E" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <div class="main-container">
    <!-- Form Section -->
    <div class="form-container">
      <div class="icon-header">
        <i class="fas fa-search"></i>
      </div>
      <div class="title">Check Parking Session</div>
      <div class="subtitle">Enter your car's plate number to proceed with payment</div>
      <form id="plateForm">
        <div class="input-group">
          <label class="input-label" for="plateNumber">Car Plate Number</label>
          <input
            type="text"
            id="plateNumber"
            name="plateNumber"
            class="input-field"
            placeholder="e.g. AB123CD"
            required
          />
        </div>
        <button type="submit" class="button">Search Session</button>
      </form>
    </div>

    <!-- Session Info Section -->
    <div class="session-info" id="sessionInfo" style="display: none;">
      <div class="title">Session Details</div>
      <div class="info-item"><strong>Plate Number:</strong> <span id="infoPlate"></span></div>
      <div class="info-item"><strong>Time:</strong> <span id="infoTime"></span></div>
      <div class="info-item"><strong>Amount:</strong> <span id="infoAmount"></span> <span id="infoCurrency"></span></div>
    </div>

    <!-- Payment Section -->
    <div id="payment-element" class="stripe-container"></div>
    <button id="confirmPayment" class="pay-button">Confirm Payment</button>
  </div>

  <script src="https://js.stripe.com/v3/"></script>
  <script type="module" src="scripts/script.js"></script>
</body>
</html>
