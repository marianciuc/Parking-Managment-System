[databases]
* = host=postgress-database port=5432 auth_user=root

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = 
user = postgres
auth_file = /etc/pgbouncer/userlist.txt
auth_type = scram-sha-256
pool_mode = session
max_client_conn = 400
default_pool_size = 20
ignore_startup_parameters = extra_float_digits

# Log settings
admin_users = root

